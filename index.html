<script>
const DB='amu_infirmary_v2', STORE='data';
let state={page:'home',data:{characters:[],relations:[],worlds:[],music:[],archive:[],archiveFolders:[],archiveImages:[],stickers:[]},editing:null,detail:null,search:''};
function dbOpen(){return new Promise((res,rej)=>{let r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function load(){try{let d=await dbOpen();let v=await new Promise((res,rej)=>{let r=d.transaction(STORE).objectStore(STORE).get('main');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});if(v)state.data=v;state.data.archiveFolders ||= [];state.data.archiveImages ||= [];state.data.stickers ||= [];d.close()}catch(e){console.log(e)}render()}

 <div class="grid home-grid">${[['♙','キャラクター','CHARACTER FILE','characters'],['♡','関係性','RELATION CHART','relations'],['✧','世界観','WORLD RECORD','worlds'],['♫','音楽','MUSIC ARCHIVE','music'],['▤','資料室','ILLUSTRATION BOX','archive'],['⚙','設定','MY ROOM','settings']].map(x=>`<button class="dept" onclick="go('${x[3]}')"><span class="ico">${x[0]}</span><strong>${x[1]}</strong><small>${x[2]}</small><i>OPEN ↗</i></button>`).join('')}</div>
 <section class="panel home-gallery"><div class="panel-heading"><span>♡ MY ILLUSTRATION FILES</span><b>最近追加したイラスト</b></div>${gallery.length?`<div class="home-gallery-grid">${gallery.map(im=>`<button onclick="go('archive');state.archiveFolder='${im.folderId}';render()"><img src="${im.data}" alt="${esc(im.name||'イラスト')}"></button>`).join('')}</div>`:'<div class="gallery-empty">♡ ここには資料室に追加したイラストが表示されます ♡<br>まずはキャラクター別フォルダに画像を追加してね</div>'}<button class="mini-link" onclick="go('archive')">資料室をひらく　♡</button></section>

 if(state.page==='characters'){if(state.detail){renderCharacterDetail();return}a.innerHTML=pageTitle('キャラクター','CHARACTER DIRECTORY',`<button class="primary" onclick="openForm()">＋ 新規登録</button>`)+`<div class="toolbar"><input placeholder="名前・タグ・MBTIで検索…" value="${esc(state.search)}" oninput="state.search=this.value;render()"></div><div class="item-grid">${state.data.characters.filter(c=>(c.name+c.reading+c.tags+c.mbti).toLowerCase().includes(state.search.toLowerCase())).map(c=>`<article class="card char-card" onclick="state.detail='${c.id}';render()">${c.images?.[0]?`<img src="${c.images[0]}">`:`<div style="aspect-ratio:1.35;background:var(--pale)"></div>`}<div class="meta"><strong>${esc(c.name)}</strong><div class="muted">${esc(c.reading||'')}</div><div class="tags">${(c.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')} ${c.mbti?`<span class="tag">${esc(c.mbti)}</span>`:''}</div></div></article>`).join('')}</div>${state.data.characters.length?'':'<div class="empty">登録されたキャラクターはまだいません</div>'}`;return}
 if(state.page==='archive'){renderArchive();return}
 if(state.page==='relations'||state.page==='worlds'||state.page==='music'){renderCollection();return}
 if(state.page==='settings'){a.innerHTML=pageTitle('設定・マイルーム','MY ROOM')+`<section class="panel"><div class="panel-heading"><span>♡ MY STICKER COLLECTION</span><b>ステッカーBOX</b></div><p class="muted">ここは自分専用のステッカー保管場所です。追加した画像はホームのメイン欄には表示されません。</p><input id="stickerUpload" type="file" accept="image/*" multiple hidden onchange="uploadStickers(this.files)"><button class="primary" onclick="document.getElementById('stickerUpload').click()">♡ ステッカー画像を追加</button><div class="sticker-grid" style="margin-top:13px">${(state.data.stickers||[]).map((st,i)=>`<div class="sticker-item"><img src="${st.data}" alt="${esc(st.name)}"><div class="muted">${esc(st.name)}</div><button class="danger small" onclick="deleteSticker(${i})">削除</button></div>`).join('')||'<div class="gallery-empty" style="grid-column:1/-1">♡ まだステッカーがありません ♡</div>'}</div></section><section class="panel"><h3>データ管理</h3><p class="muted">登録データと画像をJSONファイルにまとめて保存できます。</p><div class="actions"><button class="primary" onclick="backup()">バックアップを書き出す</button><button onclick="document.getElementById('restore').click()">バックアップを読み込む</button><input id="restore" type="file" accept="application/json" hidden onchange="restore(this.files[0])"></div></section><section class="panel"><h3>保存について</h3><p class="muted">データはこのブラウザ内に保存されます。ブラウザのデータ削除や端末変更の前にバックアップしてください。</p></section>`;return}

function openForm(id=null){state.editing=id;state.page='characters';state.detail=null;renderCharacterForm()}
const fields=[['基本','name','名前'],['','reading','読み方'],['','alias','愛称'],['','gender','性別'],['','age','年齢'],['','birthday','誕生日'],['','height','身長'],['','species','種族'],['','occupation','職業・所属'],['','mbti','MBTI'],['外見','hair','髪'],['','eyes','目'],['','appearance','外見・服装'],['性格・設定','personality','性格'],['','speech','口調・一人称'],['','likes','好きなもの'],['','dislikes','苦手なもの'],['','ability','能力・特技'],['','past','過去・経歴'],['','secret','秘密・補足']];
function renderCharacterForm(){
 let c=state.data.characters.find(x=>x.id===state.editing)||{};
 let a=document.getElementById('app');
 a.innerHTML=pageTitle(state.editing?'キャラクター編集':'新規登録','CHARACTER RECORD',`<button onclick="go('characters')">戻る</button>`)+`<form class="panel" id="charform" onsubmit="saveCharacter(event)">
 <div class="section-label">基本情報</div><div class="formgrid">${fields.slice(0,10).map(f=>inputField(f,c)).join('')}</div>
 <div class="section-label">外見・性格・設定</div><div class="formgrid">${fields.slice(10).map(f=>inputField(f,c,true)).join('')}</div>
 <div class="section-label">画像</div><div class="field"><label>画像を複数追加</label><input id="images" type="file" accept="image/*" multiple><div class="thumbrow">${(c.images||[]).map((im,i)=>`<div><img src="${im}"><button type="button" class="small danger" onclick="removeImage(${i})">削除</button></div>`).join('')}</div></div>
 <div class="section-label">タグ</div><div class="field"><label>カンマ区切り</label><input name="tags" value="${esc((c.tags||[]).join(','))}" placeholder="例：創作, 人外, 主人公"></div>
 <div class="section-label">自由項目</div><div id="customFields">${(c.custom||[]).map((x,i)=>customRow(x.key,x.value,i)).join('')}</div><button type="button" class="small" onclick="addCustom()">＋ 項目を追加</button>
 <div class="section-label">メモ</div><textarea name="notes" placeholder="自由記入">${esc(c.notes||'')}</textarea>
 <hr><div class="actions"><button class="primary" type="submit">保存</button><button type="button" onclick="go('characters')">キャンセル</button></div></form>`;
}
function inputField(f,c,multi=false){let [section,key,label]=f;let val=c[key]||'';let isLong=['appearance','personality','speech','likes','dislikes','ability','past','secret'].includes(key);return `<div class="field ${isLong?'full':''}"><label>${label}</label>${isLong?`<textarea name="${key}" placeholder="${label}">${esc(val)}</textarea>`:`<input name="${key}" value="${esc(val)}" placeholder="${label}">`}</div>`}
function customRow(k='',v='',i=''){return `<div class="custom-row"><input placeholder="項目名" value="${esc(k)}"><input placeholder="内容" value="${esc(v)}"><button type="button" class="small danger" onclick="this.parentNode.remove()">削除</button></div>`}
function addCustom(){document.getElementById('customFields').insertAdjacentHTML('beforeend',customRow())}
function removeImage(i){let c=state.data.characters.find(x=>x.id===state.editing);c.images.splice(i,1);renderCharacterForm()}
async function saveCharacter(e){e.preventDefault();let f=new FormData(e.target),c=state.data.characters.find(x=>x.id===state.editing)||{id:crypto.randomUUID(),images:[],custom:[]};for(let [k,v] of f.entries())if(k!=='tags')c[k]=v;c.tags=(f.get('tags')||'').split(',').map(x=>x.trim()).filter(Boolean);c.custom=[...document.querySelectorAll('#customFields .custom-row')].map(r=>{let i=r.querySelectorAll('input');return {key:i[0].value,value:i[1].value}}).filter(x=>x.key||x.value);let files=[...(document.getElementById('images').files||[])];for(let file of files)c.images.push(await fileToData(file));let idx=state.data.characters.findIndex(x=>x.id===c.id);if(idx<0)state.data.characters.push(c);else state.data.characters[idx]=c;await save();go('characters')}
function fileToData(file){return new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)})}
function renderCharacterDetail(){let c=state.data.characters.find(x=>x.id===state.detail);if(!c){state.detail=null;render();return}let a=document.getElementById('app');a.innerHTML=pageTitle('キャラクター詳細','CHARACTER FILE',`<button onclick="state.detail=null;render()">一覧へ</button>`)+`<section class="panel"><div class="detail-head">${c.images?.[0]?`<img src="${c.images[0]}">`:''}<div><h2>${esc(c.name)}</h2><div class="muted">${esc(c.reading||'')}${c.alias?` ・ 愛称：${esc(c.alias)}`:''}</div><div class="tags">${(c.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div></div></div><div class="thumbrow">${(c.images||[]).slice(1).map(im=>`<img src="${im}">`).join('')}</div>${fields.map(f=>c[f[1]]?`<div class="detail-section"><h3>${f[2]}</h3><p>${esc(c[f[1]])}</p></div>`:'').join('')}${(c.custom||[]).map(x=>`<div class="detail-section"><h3>${esc(x.key)}</h3><p>${esc(x.value)}</p></div>`).join('')}${c.notes?`<div class="detail-section"><h3>メモ</h3><p>${esc(c.notes)}</p></div>`:''}<div class="actions"><button class="primary" onclick="openForm('${c.id}')">編集</button><button class="danger" onclick="deleteItem('characters','${c.id}')">削除</button></div></section>`}
function renderArchive(){
 let a=document.getElementById('app');let folders=state.data.archiveFolders||[];let images=state.data.archiveImages||[];
 if(state.archiveFolder){let f=folders.find(x=>x.id===state.archiveFolder);if(!f){state.archiveFolder=null;renderArchive();return}let list=images.map((x,i)=>({...x,index:i})).filter(x=>x.folderId===f.id).reverse();a.innerHTML=pageTitle(esc(f.name),'ILLUSTRATION FOLDER',`<button onclick="state.archiveFolder=null;renderArchive()">フォルダ一覧</button>`)+`<div class="toolbar"><button class="primary" onclick="document.getElementById('archiveUpload').click()">♡ 画像を追加</button><input id="archiveUpload" type="file" accept="image/*" multiple hidden onchange="uploadArchiveImages('${f.id}',this.files)"><button onclick="renameArchiveFolder('${f.id}')">名前変更</button><button class="danger" onclick="deleteArchiveFolder('${f.id}')">フォルダ削除</button></div>${list.length?`<div class="archive-images">${list.map(x=>`<div class="archive-image"><img src="${x.data}" alt="${esc(x.name||'イラスト')}" onclick="openArchiveImage(${x.index})"><button class="danger" onclick="deleteArchiveImage(${x.index})">画像を削除</button></div>`).join('')}</div>`:'<div class="gallery-empty">♡ このフォルダはまだ空です ♡<br>イラストを追加してね</div>'}`;return}
 a.innerHTML=pageTitle('資料室','CHARACTER ILLUSTRATION FILES',`<button class="primary" onclick="createArchiveFolder()">＋ フォルダ作成</button>`)+`<div class="error-window"><div class="error-titlebar"><span>ARCHIVE.EXE　—　画像資料室</span><span class="window-dots"><i></i><i></i><i></i></span></div><div class="error-content"><div class="error-icon">▣</div><p><strong>キャラクターごとにイラストを保管できます。</strong><br>フォルダを作って、その子の画像をまとめて追加してください。</p></div></div>${folders.length?`<div class="folder-grid">${folders.map(f=>`<button class="folder-card" onclick="state.archiveFolder='${f.id}';renderArchive()"><span class="folder-ico">📁</span><strong>${esc(f.name)}</strong><small>${images.filter(im=>im.folderId===f.id).length} images　♡</small></button>`).join('')}</div>`:'<div class="gallery-empty">♡ まだフォルダがありません ♡<br>「フォルダ作成」からキャラクター名で作ってね</div>'}`;
}
function createArchiveFolder(){let name=prompt('フォルダ名を入力してください');if(!name||!name.trim())return;(state.data.archiveFolders ||= []).push({id:crypto.randomUUID(),name:name.trim()});save().then(render)}
function renameArchiveFolder(id){let f=state.data.archiveFolders.find(x=>x.id===id);if(!f)return;let name=prompt('新しいフォルダ名',f.name);if(!name||!name.trim())return;f.name=name.trim();save().then(render)}
async function deleteArchiveFolder(id){if(!confirm('フォルダと中の画像を削除しますか？'))return;state.data.archiveFolders=state.data.archiveFolders.filter(x=>x.id!==id);state.data.archiveImages=state.data.archiveImages.filter(x=>x.folderId!==id);state.archiveFolder=null;await save();render()}
async function uploadArchiveImages(folderId,files){if(!files?.length)return;for(const file of files){if(!file.type.startsWith('image/'))continue;(state.data.archiveImages ||= []).push({id:crypto.randomUUID(),folderId,name:file.name,data:await fileToData(file),createdAt:Date.now()})}await save();renderArchive()}
async function deleteArchiveImage(index){if(!confirm('この画像を削除しますか？'))return;state.data.archiveImages.splice(index,1);await save();renderArchive()}
function openArchiveImage(index){let im=state.data.archiveImages[index];if(!im)return;let layer=document.createElement('div');layer.className='image-viewer';layer.style.cssText='position:fixed;inset:0;z-index:120;background:#315c7acc;display:grid;place-items:center;padding:18px';layer.innerHTML=`<div style="max-width:95vw;max-height:90vh;background:white;padding:8px;border:3px solid white;border-radius:18px;box-shadow:0 5px 0 #a9d5f5"><img src="${im.data}" style="display:block;max-width:85vw;max-height:78vh;object-fit:contain;border-radius:10px"><button style="width:100%;margin-top:8px" onclick="this.closest('.image-viewer').remove()">とじる　♡</button></div>`;layer.addEventListener('click',e=>{if(e.target===layer)layer.remove()});document.body.appendChild(layer)}
async function uploadStickers(files){if(!files?.length)return;for(const file of files){if(!file.type.startsWith('image/'))continue;(state.data.stickers ||= []).push({id:crypto.randomUUID(),name:file.name,data:await fileToData(file)})}await save();render()}
async function deleteSticker(i){if(!confirm('ステッカーを削除しますか？'))return;state.data.stickers.splice(i,1);await save();render()}
const collections={relations:['関係性','RELATIONS',[['関係名','title'],['A→B','ab'],['B→A','ba'],['出会い・経緯','history'],['詳細','detail']], 'relation'],worlds:['世界観','WORLDS',[['名称','title'],['分類','category'],['概要','summary'],['詳細設定','detail'],['関連キャラクター','characters']], 'world'],music:['音楽','MUSIC',[['曲名','title'],['アーティスト','artist'],['URL','url'],['イメージ・解釈','notes']], 'music'],archive:['資料室','ARCHIVE',[['タイトル','title'],['分類','category'],['内容','body'],['タグ','tags']], 'archive']};
function charById(id){return state.data.characters.find(c=>c.id===id)}
function charByName(name){return state.data.characters.find(c=>c.name===name)}
function relationCharValue(item,key){let raw=item[key]||'';return charById(raw)?.id || charByName(raw)?.id || ''}
function charChip(c){if(!c)return '<span class="muted">未選択</span>';return `<span class="linked-char">${c.images?.[0]?`<img src="${c.images[0]}">`:''}${esc(c.name)}</span>`}
function personTile(c){return `<div class="person-chip">${c?.images?.[0]?`<img src="${c.images[0]}">`:`<div style="width:58px;height:58px;border-radius:50%;background:var(--pale);margin:0 auto 7px;display:grid;place-items:center;color:var(--blue)">♙</div>`}<strong>${esc(c?.name||'未選択')}</strong></div>`}
function safeUrl(raw){try{let u=new URL(String(raw||'').trim());return ['https:','http:','spotify:'].includes(u.protocol)?esc(u.href):''}catch(e){return ''}}
function renderCollection(){let [name,en,fs]=collections[state.page],items=state.data[state.page];let a=document.getElementById('app');a.innerHTML=pageTitle(name,en,`<button class="primary" onclick="addCollection()">＋ 追加</button>`)+`<div class="toolbar"><input placeholder="検索…" value="${esc(state.search)}" oninput="state.search=this.value;renderCollection()"></div>${items.filter(x=>JSON.stringify(x).toLowerCase().includes(state.search.toLowerCase()) || (state.page==='relations' && [charById(x.a)?.name,charById(x.b)?.name].join(' ').toLowerCase().includes(state.search.toLowerCase())) || (state.page==='music' && musicChars(x).map(c=>c.name).join(' ').toLowerCase().includes(state.search.toLowerCase()))).map(x=>collectionCard(x)).join('')||'<div class="empty">登録はまだありません</div>'}`}
function musicChars(x){let ids=Array.isArray(x.characterIds)?x.characterIds:[];let found=ids.map(charById).filter(Boolean);if(!found.length&&x.character){let c=charById(x.character)||charByName(x.character);if(c)found=[c]}return found}
function collectionCard(x){if(state.page==='relations'){let ca=charById(x.a)||charByName(x.a),cb=charById(x.b)||charByName(x.b);return `<section class="panel relation-card"><div class="relation-pair">${personTile(ca)}<div class="relation-mark">↔</div>${personTile(cb)}</div><div class="relation-title">${esc(x.title||'関係性')}</div><div class="relation-sub">${esc(x.ab||'')} ${x.ba?' ／ '+esc(x.ba):''}</div>${x.history||x.detail?`<div class="detail-section"><p>${esc(x.history||x.detail)}</p></div>`:''}<div class="actions"><button onclick="editCollection('${x.id}')">編集</button><button class="danger" onclick="deleteItem('relations','${x.id}')">削除</button></div></section>`}
 if(state.page==='music'){let chars=musicChars(x);return `<section class="panel music-card"><div class="music-cover">♫</div><div><h3>${esc(x.title||'無題')}</h3><div class="muted">${esc(x.artist||'アーティスト未設定')}</div><div class="linked-chars">${chars.map(charChip).join('')||'<span class="muted">関連キャラなし</span>'}</div>${x.notes?`<p style="white-space:pre-wrap;font-size:13px;line-height:1.6">${esc(x.notes)}</p>`:''}${safeUrl(x.url)?`<a class="link-button" href="${safeUrl(x.url)}" target="_blank" rel="noopener noreferrer">♫ Spotifyで曲を開く ↗</a>`:''}<div class="actions" style="margin-top:9px"><button onclick="editCollection('${x.id}')">編集</button><button class="danger" onclick="deleteItem('music','${x.id}')">削除</button></div></div></section>`}
 return `<section class="panel"><h3>${esc(x.title||x.category||'')}</h3><div class="muted">${esc(x.category||'')}</div><p style="white-space:pre-wrap;font-size:13px">${esc(x.summary||x.detail||x.notes||x.body||'')}</p><div class="actions"><button onclick="editCollection('${x.id}')">編集</button><button class="danger" onclick="deleteItem('${state.page}','${x.id}')">削除</button></div></section>`}
function addCollection(id=null){let fs=collections[state.page][2],old=state.data[state.page].find(x=>x.id===id)||{},a=document.getElementById('app');let body='';
 if(state.page==='relations'){
  let aid=relationCharValue(old,'a'),bid=relationCharValue(old,'b');
  body=`<div class="field full"><label>キャラクター A</label><select name="a" required><option value="">キャラクターを選択</option>${state.data.characters.map(c=>`<option value="${esc(c.id)}" ${c.id===aid?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div><div class="field full"><label>キャラクター B</label><select name="b" required><option value="">キャラクターを選択</option>${state.data.characters.map(c=>`<option value="${esc(c.id)}" ${c.id===bid?'selected':''}>${esc(c.name)}</option>`).join('')}</select><div class="select-note">登録済みキャラクターから選択します。AとBは別のキャラクターを選んでください。</div></div>`+fs.map(([l,k])=>`<div class="field ${['detail','history','ab','ba'].includes(k)?'full':''}"><label>${l}</label>${['detail','history','ab','ba'].includes(k)?`<textarea name="${k}">${esc(old[k]||'')}</textarea>`:`<input name="${k}" value="${esc(old[k]||'')}">`}</div>`).join('');
 } else if(state.page==='music'){
  let selected=musicChars(old).map(c=>c.id);
  body=`<div class="field full"><label>関連キャラクター</label><div class="check-list">${state.data.characters.map(c=>`<label class="check-option"><input type="checkbox" name="characterIds" value="${esc(c.id)}" ${selected.includes(c.id)?'checked':''}>${esc(c.name)}</label>`).join('')||'<span class="muted">先にキャラクターを登録してください</span>'}</div><div class="select-note">複数選択できます。キャラを選ばずに曲だけ登録することもできます。</div></div>`+fs.map(([l,k])=>`<div class="field ${k==='notes'?'full':''}"><label>${k==='url'?'Spotifyリンク':l}</label>${k==='notes'?`<textarea name="${k}">${esc(old[k]||'')}</textarea>`:`<input name="${k}" ${k==='url'?'type="url" inputmode="url" placeholder="https://open.spotify.com/track/..."':''} value="${esc(old[k]||'')}">`}${k==='url'?'<div class="tiny-note">Spotifyの共有リンクを貼り付けてください。</div>':''}</div>`).join('');
 } else {
  body=fs.map(([l,k])=>`<div class="field ${['detail','summary','body','notes'].includes(k)?'full':''}"><label>${l}</label>${['detail','summary','body','notes'].includes(k)?`<textarea name="${k}">${esc(old[k]||'')}</textarea>`:`<input name="${k}" value="${esc(old[k]||'')}">`}</div>`).join('');
 }
 a.innerHTML=pageTitle(id?'編集':'新規登録',collections[state.page][1])+`<form class="panel" onsubmit="saveCollection(event,'${id||''}')"><div class="formgrid">${body}</div><div class="actions"><button class="primary">保存</button><button type="button" onclick="render()">戻る</button></div></form>`;
}
function editCollection(id){addCollection(id)}
async function saveCollection(e,id){e.preventDefault();let fd=new FormData(e.target),obj={};for(let [k,v] of fd.entries()){if(k==='characterIds'){(obj.characterIds ||= []).push(v)}else obj[k]=v}if(state.page==='relations'&&obj.a===obj.b){alert('別々のキャラクターを選択してください');return}if(state.page==='music'){obj.characterIds ||= [];delete obj.character}obj.id=id||crypto.randomUUID();let arr=state.data[state.page],i=arr.findIndex(x=>x.id===obj.id);if(i<0)arr.push(obj);else arr[i]=obj;await save();render()}
async function deleteItem(type,id){if(!confirm('削除しますか？'))return;state.data[type]=state.data[type].filter(x=>x.id!==id);await save();state.detail=null;render()}
async function backup(){let blob=new Blob([JSON.stringify(state.data)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='AMU-INFIRMARY-backup.json';a.click();URL.revokeObjectURL(url)}
async function restore(file){if(!file)return;try{let d=JSON.parse(await file.text());for(let k of Object.keys(state.data))if(Array.isArray(d[k]))state.data[k]=d[k];await save();alert('復元しました');render()}catch(e){alert('読み込みに失敗しました')}}
document.addEventListener('pointermove',e=>{if(e.pointerType==='touch'||Math.random()>.22)return;const s=document.createElement('span');s.className='cursor-spark';s.textContent=['✦','♡','✧'][Math.floor(Math.random()*3)];s.style.left=e.clientX+'px';s.style.top=e.clientY+'px';document.body.appendChild(s);setTimeout(()=>s.remove(),700)});
load();
