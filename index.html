<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#edf6fb">
<title>AMU INFIRMARY</title>
<style>
:root{--ink:#36566a;--muted:#8299a8;--blue:#78a9c0;--pale:#e8f3f9;--line:#d9e6ed;--paper:#fff;--bg:#f3f8fb;--shadow:0 5px 18px #55788a12}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif;padding-bottom:86px}
header{position:sticky;top:0;z-index:5;background:#f4f9fcf2;backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:17px 20px 13px;display:flex;align-items:center;justify-content:space-between}
.brand{font-weight:800;letter-spacing:.16em;font-size:18px}.sub{font-size:9px;letter-spacing:.25em;color:#91a9b7;margin-top:5px}
button,.btn{border:1px solid var(--line);background:white;color:var(--ink);border-radius:12px;padding:11px 14px;font-size:14px;font-weight:650;cursor:pointer}
button.primary{background:var(--blue);border-color:var(--blue);color:white}button.ghost{background:transparent}button.danger{color:#b66e76;border-color:#efd9dc}
main{max-width:900px;margin:auto;padding:20px 17px 35px}.page-title{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:12px 0 18px}.page-title h1{font-size:21px;margin:0}.eyebrow{font-size:10px;letter-spacing:.18em;color:#91a9b7;margin-top:5px}
.panel,.card{background:var(--paper);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}.panel{padding:17px;margin-bottom:14px}.welcome{padding:25px;background:linear-gradient(135deg,#e5f2f9,#f7fbfd);margin:12px 0 25px}.welcome h1{font-size:26px;margin:0 0 6px}.welcome p{margin:0;color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.dept{min-height:112px;text-align:left;padding:17px;border-radius:19px;background:#fff}.dept .ico{font-size:22px;color:var(--blue);display:block;margin-bottom:12px}.dept strong{display:block;font-size:15px}.dept small{color:var(--muted);letter-spacing:.12em;font-size:10px}
input,textarea,select{width:100%;border:1px solid var(--line);border-radius:11px;background:#fbfdfe;padding:11px 12px;color:var(--ink);font:inherit;font-size:14px;outline:none}textarea{min-height:84px;resize:vertical}label{display:block;font-size:12px;font-weight:700;color:#69879a;margin-bottom:5px}.field{min-width:0}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.field.full{grid-column:1/-1}.section-label{font-size:12px;letter-spacing:.12em;color:#8aa3b2;border-bottom:1px solid var(--line);padding:12px 0 7px;margin:8px 0 10px}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 0}.toolbar input{flex:1;min-width:160px}
.item-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.char-card{overflow:hidden;cursor:pointer}.char-card img{width:100%;aspect-ratio:1.35;object-fit:cover;display:block;background:var(--pale)}.char-card .meta{padding:12px}.char-card strong{display:block}.muted{color:var(--muted);font-size:12px}.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}.tag{font-size:10px;background:var(--pale);padding:4px 8px;border-radius:20px;color:#64879b}
.bottom{position:fixed;z-index:6;bottom:0;left:0;right:0;background:#ffffffed;backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom))}.bottom button{border:0;background:none;padding:5px 8px;color:#8ba1ae;font-size:10px;min-width:55px}.bottom button b{display:block;font-size:19px;font-weight:400;margin-bottom:2px}.bottom button.active{color:#5489a3}
.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{flex:1}.empty{text-align:center;color:#91a5b1;padding:32px 10px;font-size:13px}
.detail-head{display:flex;gap:14px;align-items:center;margin-bottom:15px}.detail-head img{width:100px;height:100px;object-fit:cover;border-radius:16px;background:var(--pale)}.detail-head h2{margin:0 0 5px;font-size:20px}.detail-section{padding:13px 0;border-top:1px solid var(--line)}.detail-section h3{font-size:12px;color:#7e9bab;margin:0 0 7px}.detail-section p{white-space:pre-wrap;margin:0;font-size:14px;line-height:1.65}
.thumbrow{display:flex;gap:8px;overflow:auto;margin:8px 0}.thumbrow img{width:76px;height:76px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.custom-row{display:grid;grid-template-columns:1fr 1.4fr auto;gap:7px;margin:7px 0}.small{font-size:11px;padding:7px 9px}
hr{border:0;border-top:1px solid var(--line);margin:15px 0}
@media(min-width:650px){.item-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.formgrid{grid-template-columns:repeat(3,minmax(0,1fr))}.char-card img{aspect-ratio:1.4}}
@media(max-width:380px){.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}.custom-row{grid-template-columns:1fr 1fr}.custom-row button{grid-column:1/-1}}
</style>
</head>
<body>
<header><div><div class="brand">AMU INFIRMARY</div><div class="sub">CREATIVE MEDICAL ARCHIVE</div></div><button class="primary" onclick="openForm()">＋</button></header>
<main id="app"></main>
<nav class="bottom">
<button data-page="home" onclick="go('home')"><b>⌂</b>受付</button>
<button data-page="characters" onclick="go('characters')"><b>♙</b>キャラクター</button>
<button data-page="archive" onclick="go('archive')"><b>▤</b>資料室</button>
<button data-page="settings" onclick="go('settings')"><b>⚙</b>設定</button>
</nav>
<script>
const DB='amu_infirmary_v2', STORE='data';
let state={page:'home',data:{characters:[],relations:[],worlds:[],music:[],archive:[]},editing:null,detail:null,search:''};
function dbOpen(){return new Promise((res,rej)=>{let r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function load(){try{let d=await dbOpen();let v=await new Promise((res,rej)=>{let r=d.transaction(STORE).objectStore(STORE).get('main');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});if(v)state.data=v;d.close()}catch(e){console.log(e)}render()}
async function save(){let d=await dbOpen();await new Promise((res,rej)=>{let t=d.transaction(STORE,'readwrite');t.objectStore(STORE).put(state.data,'main');t.oncomplete=res;t.onerror=()=>rej(t.error)});d.close()}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function go(p){state.page=p;state.detail=null;state.editing=null;state.search='';render()}
function pageTitle(a,b,btn=''){return `<div class="page-title"><div><h1>${a}</h1><div class="eyebrow">${b}</div></div>${btn}</div>`}
function render(){
 document.querySelectorAll('.bottom button').forEach(b=>b.classList.toggle('active',b.dataset.page===state.page));
 let a=document.getElementById('app');
 if(state.page==='home'){a.innerHTML=`<section class="welcome"><div class="eyebrow">FRONT DESK</div><h1>AMU INFIRMARY</h1></section><h3>メニュー</h3><div class="grid">${[['♙','キャラクター','characters'],['⌘','関係性','relations'],['◎','世界観','worlds'],['♫','音楽','music'],['▤','資料室','archive'],['⚙','設定','settings']].map(x=>`<button class="dept" onclick="go('${x[2]}')"><span class="ico">${x[0]}</span><strong>${x[1]}</strong><small>${x[2].toUpperCase()}</small></button>`).join('')}</div>`;return}
 if(state.page==='characters'){if(state.detail){renderCharacterDetail();return}a.innerHTML=pageTitle('キャラクター','CHARACTER DIRECTORY',`<button class="primary" onclick="openForm()">＋ 新規登録</button>`)+`<div class="toolbar"><input placeholder="名前・タグ・MBTIで検索…" value="${esc(state.search)}" oninput="state.search=this.value;render()"></div><div class="item-grid">${state.data.characters.filter(c=>(c.name+c.reading+c.tags+c.mbti).toLowerCase().includes(state.search.toLowerCase())).map(c=>`<article class="card char-card" onclick="state.detail='${c.id}';render()">${c.images?.[0]?`<img src="${c.images[0]}">`:`<div style="aspect-ratio:1.35;background:var(--pale)"></div>`}<div class="meta"><strong>${esc(c.name)}</strong><div class="muted">${esc(c.reading||'')}</div><div class="tags">${(c.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')} ${c.mbti?`<span class="tag">${esc(c.mbti)}</span>`:''}</div></div></article>`).join('')}</div>${state.data.characters.length?'':'<div class="empty">登録されたキャラクターはまだいません</div>'}`;return}
 if(state.page==='relations'||state.page==='worlds'||state.page==='music'||state.page==='archive'){renderCollection();return}
 if(state.page==='settings'){a.innerHTML=pageTitle('設定','SYSTEM')+`<section class="panel"><h3>データ管理</h3><p class="muted">登録データと画像をJSONファイルにまとめて保存できます。</p><div class="actions"><button class="primary" onclick="backup()">バックアップを書き出す</button><button onclick="document.getElementById('restore').click()">バックアップを読み込む</button><input id="restore" type="file" accept="application/json" hidden onchange="restore(this.files[0])"></div></section><section class="panel"><h3>保存について</h3><p class="muted">データはこのブラウザ内に保存されます。ブラウザのデータ削除や端末変更の前にバックアップしてください。</p></section>`;return}
}
function openForm(id=null){state.editing=id;state.page='characters';state.detail=null;renderCharacterForm()}
const fields=[['基本','name','名前'],['','reading','読み方'],['','alias','別名・通称'],['','gender','性別'],['','age','年齢'],['','birthday','誕生日'],['','height','身長'],['','species','種族'],['','occupation','職業・所属'],['','mbti','MBTI'],['外見','hair','髪'],['','eyes','目'],['','appearance','外見・服装'],['性格・設定','personality','性格'],['','speech','口調・一人称'],['','likes','好きなもの'],['','dislikes','苦手なもの'],['','ability','能力・特技'],['','past','過去・経歴'],['','secret','秘密・補足']];
function renderCharacterForm(){
 let c=state.data.characters.find(x=>x.id===state.editing)||{};
 let a=document.getElementById('app');
 a.innerHTML=pageTitle(state.editing?'キャラクター編集':'新規登録','CHARACTER RECORD',`<button onclick="go('characters')">戻る</button>`)+`<form class="panel" id="charform" onsubmit="saveCharacter(event)">
 <div class="section-label">基本情報</div><div class="formgrid">${fields.slice(0,10).map(f=>inputField(f,c)).join('')}</div>
 <div class="section-label">外見・性格・設定</div><div class="formgrid">${fields.slice(10).map(f=>inputField(f,c,true)).join('')}</div>
 <div class="section-label">画像</div><div class="field"><label>画像を複数追加</label><input id="images" type="file" accept="image/*" multiple><div class="thumbrow">${(c.images||[]).map((im,i)=>`<div><img src="${im}"><button type="button" class="small danger" onclick="removeImage(${i})">削除</button></div>`).join('')}</div></div>
 <div class="section-label">タグ</div><div class="field"><label>カンマ区切り</label><input name="tags" value="${esc((c.tags||[]).join(','))}" placeholder="例：創作, 人外, 主人公"></div>
 <div class="section-label">自由項目</div><div id="customFields">${(c.custom||[]).map((x,i)=>customRow(x.key,x.value,i)).join('')}</div><button type="button" class="small" onclick="addCustom()">＋ 項目を追加</button>
 <div class="section-label">メモ</div><textarea name="notes" placeholder="自由記入">${esc(c.notes||'')}</textarea>
 <hr><div class="actions"><button class="primary" type="submit">保存</button><button type="button" onclick="go('characters')">キャンセル</button></div></form>`;
}
function inputField(f,c,multi=false){let [section,key,label]=f;let val=c[key]||'';let isLong=['appearance','personality','speech','likes','dislikes','ability','past','secret'].includes(key);return `<div class="field ${isLong?'full':''}"><label>${label}</label>${isLong?`<textarea name="${key}" placeholder="${label}">${esc(val)}</textarea>`:`<input name="${key}" value="${esc(val)}" placeholder="${label}">`}</div>`}
function customRow(k='',v='',i=''){return `<div class="custom-row"><input placeholder="項目名" value="${esc(k)}"><input placeholder="内容" value="${esc(v)}"><button type="button" class="small danger" onclick="this.parentNode.remove()">削除</button></div>`}
function addCustom(){document.getElementById('customFields').insertAdjacentHTML('beforeend',customRow())}
function removeImage(i){let c=state.data.characters.find(x=>x.id===state.editing);c.images.splice(i,1);renderCharacterForm()}
async function saveCharacter(e){e.preventDefault();let f=new FormData(e.target),c=state.data.characters.find(x=>x.id===state.editing)||{id:crypto.randomUUID(),images:[],custom:[]};for(let [k,v] of f.entries())if(k!=='tags')c[k]=v;c.tags=(f.get('tags')||'').split(',').map(x=>x.trim()).filter(Boolean);c.custom=[...document.querySelectorAll('#customFields .custom-row')].map(r=>{let i=r.querySelectorAll('input');return {key:i[0].value,value:i[1].value}}).filter(x=>x.key||x.value);let files=[...(document.getElementById('images').files||[])];for(let file of files)c.images.push(await fileToData(file));let idx=state.data.characters.findIndex(x=>x.id===c.id);if(idx<0)state.data.characters.push(c);else state.data.characters[idx]=c;await save();go('characters')}
function fileToData(file){return new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)})}
function renderCharacterDetail(){let c=state.data.characters.find(x=>x.id===state.detail);if(!c){state.detail=null;render();return}let a=document.getElementById('app');a.innerHTML=pageTitle('キャラクター詳細','CHARACTER FILE',`<button onclick="state.detail=null;render()">一覧へ</button>`)+`<section class="panel"><div class="detail-head">${c.images?.[0]?`<img src="${c.images[0]}">`:''}<div><h2>${esc(c.name)}</h2><div class="muted">${esc(c.reading||'')} ${esc(c.alias||'')}</div><div class="tags">${(c.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div></div></div><div class="thumbrow">${(c.images||[]).slice(1).map(im=>`<img src="${im}">`).join('')}</div>${fields.map(f=>c[f[1]]?`<div class="detail-section"><h3>${f[2]}</h3><p>${esc(c[f[1]])}</p></div>`:'').join('')}${(c.custom||[]).map(x=>`<div class="detail-section"><h3>${esc(x.key)}</h3><p>${esc(x.value)}</p></div>`).join('')}${c.notes?`<div class="detail-section"><h3>メモ</h3><p>${esc(c.notes)}</p></div>`:''}<div class="actions"><button class="primary" onclick="openForm('${c.id}')">編集</button><button class="danger" onclick="deleteItem('characters','${c.id}')">削除</button></div></section>`}
const collections={relations:['関係性','RELATIONS',[['A側のキャラクター','a'],['B側のキャラクター','b'],['関係名','title'],['A→B','ab'],['B→A','ba'],['出会い・経緯','history'],['詳細','detail']], 'relation'],worlds:['世界観','WORLDS',[['名称','title'],['分類','category'],['概要','summary'],['詳細設定','detail'],['関連キャラクター','characters']], 'world'],music:['音楽','MUSIC',[['曲名','title'],['アーティスト','artist'],['URL','url'],['関連キャラクター','character'],['イメージ・解釈','notes']], 'music'],archive:['資料室','ARCHIVE',[['タイトル','title'],['分類','category'],['内容','body'],['タグ','tags']], 'archive']};
function renderCollection(){let [name,en,fs]=collections[state.page],items=state.data[state.page];let a=document.getElementById('app');a.innerHTML=pageTitle(name,en,`<button class="primary" onclick="addCollection()">＋ 追加</button>`)+`<div class="toolbar"><input placeholder="検索…" value="${esc(state.search)}" oninput="state.search=this.value;renderCollection()"></div>${items.filter(x=>JSON.stringify(x).toLowerCase().includes(state.search.toLowerCase())).map(x=>`<section class="panel"><h3>${esc(x.title||x.a+' × '+x.b||'')}</h3><div class="muted">${esc(x.category||x.artist||x.ab||'')}</div><p style="white-space:pre-wrap;font-size:13px">${esc(x.summary||x.detail||x.notes||x.body||x.url||'')}</p><div class="actions"><button onclick="editCollection('${x.id}')">編集</button><button class="danger" onclick="deleteItem('${state.page}','${x.id}')">削除</button></div></section>`).join('')||'<div class="empty">登録はまだありません</div>'}`}
function addCollection(id=null){let fs=collections[state.page][2],old=state.data[state.page].find(x=>x.id===id)||{},a=document.getElementById('app');a.innerHTML=pageTitle(id?'編集':'新規登録',collections[state.page][1])+`<form class="panel" onsubmit="saveCollection(event,'${id||''}')"><div class="formgrid">${fs.map(([l,k])=>`<div class="field ${['detail','summary','body','notes','ab','ba','history'].includes(k)?'full':''}"><label>${l}</label>${['detail','summary','body','notes','ab','ba','history'].includes(k)?`<textarea name="${k}">${esc(old[k]||'')}</textarea>`:`<input name="${k}" value="${esc(old[k]||'')}">`}</div>`).join('')}</div><div class="actions"><button class="primary">保存</button><button type="button" onclick="render()">戻る</button></div></form>`}
function editCollection(id){addCollection(id)}
async function saveCollection(e,id){e.preventDefault();let obj=Object.fromEntries(new FormData(e.target));obj.id=id||crypto.randomUUID();let arr=state.data[state.page],i=arr.findIndex(x=>x.id===obj.id);if(i<0)arr.push(obj);else arr[i]=obj;await save();render()}
async function deleteItem(type,id){if(!confirm('削除しますか？'))return;state.data[type]=state.data[type].filter(x=>x.id!==id);await save();state.detail=null;render()}
async function backup(){let blob=new Blob([JSON.stringify(state.data)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='AMU-INFIRMARY-backup.json';a.click();URL.revokeObjectURL(url)}
async function restore(file){if(!file)return;try{let d=JSON.parse(await file.text());for(let k of Object.keys(state.data))if(Array.isArray(d[k]))state.data[k]=d[k];await save();alert('復元しました');render()}catch(e){alert('読み込みに失敗しました')}}
load();
</script>
</body></html>
